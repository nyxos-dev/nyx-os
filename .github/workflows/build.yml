name: Build kernel

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same branch cancels an in-flight run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, link and package the ISO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make nasm gcc binutils python3 \
            grub-common grub-pc-bin xorriso mtools

      - name: Build kernel and userland
        run: |
          set -o pipefail
          make -C kernel 2>&1 | tee build.log

      - name: Test N++ input errors and source bounds
        run: python3 lang/nppc/tests/test_input_io.py

      - name: Test N++ indexed callback chains and single evaluation
        run: python3 lang/nppc/tests/test_indexed_calls.py

      - name: Test N++ module isolation
        run: python3 lang/nppc/tests/test_modules.py

      - name: Test N++ workbench and ownership cleanup
        run: python3 lang/nppc/tests/test_workbench.py --examples

      - name: Test N selfhost checker arguments
        run: python3 lang/selfhost/tests/test_check_cli.py

      - name: Test N selfhost input limits and I/O failures
        run: python3 lang/selfhost/tests/test_driver_io.py --corpus

      - name: Test N and N++ bootstrap output errors
        run: python3 tools/test_n_output.py

      - name: Test N-written compiler output progress and failures
        run: python3 lang/selfhost/tests/test_output_io.py

      - name: Test N-written compiler allocation failures
        run: python3 lang/selfhost/tests/test_allocations.py

      - name: Test BMP geometry and allocation failures
        run: python3 tools/test_bmp_bounds.py

      - name: Test Oneiros CLI text output and model validation
        run: python3 tools/test_oneiros_cli.py

      - name: Test Oneiros numerical inference and recovery
        run: python3 tools/test_oneiros_inference.py

      - name: Test Oneiros desktop model loading
        run: python3 tools/test_oneiros_model.py

      - name: Test package installation failures and recovery
        run: python3 tools/test_xbm_install.py

      - name: Test Mnemosyne exact text I/O and failure handling
        run: python3 tools/test_editor_io.py

      - name: Test Mnemosyne shared clipboard and undo
        run: python3 tools/test_editor_clipboard.py

      - name: Test editor save destinations, close/reload and deferred lifetime
        run: python3 tools/test_editor_close.py

      - name: Test desktop calculator arithmetic and recovery
        run: python3 tools/test_calculator.py

      - name: Test user windows without a framebuffer
        run: python3 tools/test_userwin_headless.py
      - name: Test user window stale handles and identity exhaustion
        run: python3 tools/test_userwin_handles.py
      - name: Test user window close through the compositor
        run: python3 tools/test_userwin_close.py
      - name: Test rejected window presentation before scratch allocation
        run: python3 tools/test_userwin_present.py

      - name: Test minimized window arrangement recovery
        run: python3 tools/test_window_minimize.py

      - name: Test desktop config persistence and session isolation
        run: |
          python3 tools/test_desktop_config.py
          python3 tools/test_desktop_idle.py

      - name: Test terminal palettes, ANSI rendering and console capture ownership
        run: python3 tools/test_terminal_palette.py

      - name: Test Selene lazy page memory and allocation failures
        run: python3 tools/test_selene_memory.py

      - name: Test Selene forms, layout contracts and allocation recovery
        run: python3 tools/test_selene_forms.py

      - name: Test mounted VFS full-path preservation
        run: python3 tools/test_vfs_mount_paths.py

      - name: Test RAM VFS replacement allocation failures
        run: python3 tools/test_vfs_replace.py

      - name: Test VFS write bounds and sparse growth
        run: python3 tools/test_vfs_growth.py

      - name: Test memory reporting and free options
        run: python3 tools/test_memory_reporting.py

      - name: Test lseek bounds and failed-position preservation
        run: python3 tools/test_lseek.py

      - name: Test syscall path bounds and normalization
        run: python3 tools/test_syscall_paths.py

      - name: Test exec argument and environment bounds
        run: python3 tools/test_exec_input.py

      - name: Test shell argument expansion and capacity failures
        run: python3 tools/test_sh_expansion.py

      - name: Test shell command entry status and bounds
        run: python3 tools/test_sh_entry.py

      - name: Test pipe interruption and signal stop waits
        run: python3 tools/test_pipe_signals.py

      - name: Test timeout duration bounds and tick wrap
        run: python3 tools/test_timeout.py

      - name: Test rm option and operand boundaries
        run: python3 tools/test_rm_options.py

      - name: Test cat streaming and canonical terminal input
        run: |
          python3 tools/test_cat.py
          python3 tools/test_stdin_canonical.py
          python3 tools/test_keyboard_control.py

      - name: Test RTC sampling and ELF stack metadata
        run: python3 tools/test_build_contract.py

      - name: Require a warning-free build
        run: |
          warns=$(grep -E '(^|[[:space:]])warning:' build.log || true)
          n=$(printf '%s\n' "$warns" | grep -Ec '(^|[[:space:]])warning:' || true)
          {
            echo "### Build warnings: ${n}"
            if [ -n "$warns" ]; then
              echo '```'
              printf '%s\n' "$warns"
              echo '```'
            else
              echo 'None.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$warns"
          test "$n" -eq 0

      - name: Build the bootable ISOs
        run: |
          # Two images from the same kernel: the normal ISO (boots to the desktop)
          # and a self-test ISO whose GRUB entry adds the `selftest` multiboot command
          # line, which makes the kernel run its offline self-test battery and halt
          # (consumed by the self-tests job below).
          make_iso() {   # $1 = kernel cmdline, $2 = staging dir, $3 = output iso
            mkdir -p "$2/boot/grub"
            printf '%s\n' \
              'set timeout=5' 'set default=0' \
              "menuentry 'NyxOS' {" \
              "    multiboot2 /boot/nyx-kernel.bin $1" \
              '    boot' '}' > "$2/boot/grub/grub.cfg"
            cp kernel/nyx-kernel.bin "$2/boot/"
            grub-mkrescue -o "$3" "$2"
          }
          make_iso ""         iso    NyxOS.iso
          make_iso "selftest" iso-st NyxOS-selftest.iso

      - name: Report sizes
        run: |
          {
            echo "### Build output"
            echo "| Artifact | Size |"
            echo "|---|---|"
            echo "| nyx-kernel.bin | $(du -h kernel/nyx-kernel.bin | cut -f1) |"
            echo "| NyxOS.iso | $(du -h NyxOS.iso | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nyxos-build
          path: |
            kernel/nyx-kernel.bin
            NyxOS.iso
            NyxOS-selftest.iso
          if-no-files-found: error

  smoke-boot:
    name: QEMU smoke boot (reaches login, no panic)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install QEMU and e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 e2fsprogs

      - name: Download the ISO
        uses: actions/download-artifact@v8
        with:
          name: nyxos-build

      - name: Create a blank ext2 disk
        run: |
          # NyxOS mounts an ext2 disk at /mnt during boot; a blank one is enough to
          # get past the mount and reach the login screen. Matches the makefile's
          # `disk` target: 1 KB blocks, 128-byte inodes.
          dd if=/dev/zero of=ext2-test.img bs=1M count=16 status=none
          mkfs.ext2 -q -b 1024 -I 128 -O ^resize_inode,^dir_index,^ext_attr ext2-test.img

      - name: Boot NyxOS and confirm it reaches the login screen
        run: |
          # Catches a boot regression (a panic or a hang during init) with no human
          # in the loop. Success = the kernel prints "[LOGIN] Starting login screen"
          # over the serial port, which it only reaches after ALL init has succeeded
          # (memory, paging, SMP, drivers, net, crypto, ext2 mount, compositor task).
          # KVM is unavailable on GitHub runners, so QEMU uses TCG (software) and the
          # boot is slower than on hardware — hence the generous timeout.
          timeout 240 qemu-system-x86_64 \
            -cdrom NyxOS.iso \
            -drive file=ext2-test.img,format=raw,index=0,media=disk \
            -m 512M -cpu qemu64,+rdrand,+rdseed \
            -serial file:serial.log -display none -no-reboot &
          QPID=$!
          ok=0
          for i in $(seq 1 100); do
            sleep 2
            [ -f serial.log ] || continue
            if grep -q 'Starting login screen' serial.log; then ok=1; break; fi
            if grep -Eq 'PANIC|Kernel panic|#PF|#GP|General Protection|Triple fault' serial.log; then
              echo "::error::a kernel fault was printed during boot"; break
            fi
          done
          kill "$QPID" 2>/dev/null || true
          echo '----- serial log (tail) -----'
          tail -n 40 serial.log 2>/dev/null || echo '(no serial output)'
          if [ "$ok" != "1" ]; then
            echo "::error::NyxOS did not reach the login screen within the timeout (boot hang or fault)"
            exit 1
          fi
          echo "OK: NyxOS booted cleanly to the login screen."

  selftests:
    name: Self-test battery (crypto + image decoders)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install QEMU and e2fsprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 e2fsprogs

      - name: Download the ISO
        uses: actions/download-artifact@v8
        with:
          name: nyxos-build

      - name: Create a blank ext2 disk
        run: |
          dd if=/dev/zero of=ext2-test.img bs=1M count=16 status=none
          mkfs.ext2 -q -b 1024 -I 128 -O ^resize_inode,^dir_index,^ext_attr ext2-test.img

      - name: Run the in-kernel self-test battery
        run: |
          # Boots the self-test ISO (kernel cmdline `selftest`): the kernel runs its
          # offline known-answer tests — SHA-512, CSPRNG, AES-GCM, X25519, TLS PRF /
          # key-schedule / record, DER, P-256/384, RSA, X.509, inflate, PNG/BMP/GIF/
          # JPEG — prints a summary, then halts. Fails on any FAIL, a missing summary,
          # or a kernel fault.
          timeout 240 qemu-system-x86_64 \
            -cdrom NyxOS-selftest.iso \
            -drive file=ext2-test.img,format=raw,index=0,media=disk \
            -m 512M -cpu qemu64,+rdrand,+rdseed \
            -serial file:serial.log -display none -no-reboot &
          QPID=$!
          done=0
          for i in $(seq 1 100); do
            sleep 2
            [ -f serial.log ] || continue
            if grep -q 'SELFTEST-END' serial.log; then done=1; break; fi
            if grep -Eq 'PANIC|Kernel panic|#PF|#GP|General Protection|Triple fault' serial.log; then
              echo "::error::a kernel fault occurred during the self-tests"; break
            fi
          done
          kill "$QPID" 2>/dev/null || true
          echo '----- self-test output -----'
          sed -n '/SELFTEST-BEGIN/,/SELFTEST-END/p' serial.log 2>/dev/null || true
          summary=$(grep -E 'SELFTEST-SUMMARY' serial.log || true)
          echo "summary: $summary"
          if [ "$done" != "1" ] || [ -z "$summary" ]; then
            echo "::error::the self-test battery did not complete"; exit 1
          fi
          if ! echo "$summary" | grep -q 'failed=0'; then
            echo "::error::one or more in-kernel self-tests failed"; exit 1
          fi
          echo "OK: all in-kernel self-tests passed."
